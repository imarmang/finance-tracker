spring.application.name=finance-tracker

# DB User
spring.datasource.url=jdbc:postgresql://localhost:5432/finance
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Logging: every API response is logged to the console and to logs/finance-tracker.log.
logging.file.name=logs/finance-tracker.log
logging.level.api.responses=INFO
# Set to true to also log response bodies (the financial data itself). Off by default.
app.logging.response-bodies=false
